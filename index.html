<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Valeria ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Georgia,serif;color:white;background:#090107}
#intro,#scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
#intro{z-index:10;background:radial-gradient(circle,#65132e,#090107);transition:opacity 1.4s}
#intro.hide{opacity:0;pointer-events:none}
.intro{padding:25px}.env{font-size:85px;animation:p 1.2s infinite}
.hint{margin-top:20px;letter-spacing:3px;opacity:.7}
.typeLine{display:block;min-height:1.65em}
.caret{display:inline-block;width:2px;height:1em;background:#efb7c6;margin-left:3px;vertical-align:-2px;animation:blink .75s infinite}
@keyframes blink{50%{opacity:0}}
#scene{background:radial-gradient(circle at center,#701633,#280712 45%,#050005)}
.card{width:min(90%,520px);padding:40px 24px;border-radius:30px;background:#10030b99;
border:1px solid #ffffff2b;box-shadow:0 0 80px #ff30601f;backdrop-filter:blur(8px)}
.mini{font-size:13px;letter-spacing:4px;color:#efb7c6}
.heart{font-size:76px;animation:p 1.3s infinite}
h1{font-size:clamp(40px,12vw,68px);font-weight:400;margin:8px 0 15px;text-shadow:0 0 25px #ff7195}
.line{width:80px;height:1px;background:#e8a5b8;margin:22px auto}
.msg{font-size:19px;line-height:1.7;color:#f9e5ec}
.sig{margin-top:22px;color:#ddb3c1}
button{margin-top:26px;padding:12px 23px;border-radius:30px;border:1px solid #ffffff55;
background:#ffffff10;color:white;font-size:15px}
.float{position:fixed;bottom:-50px;z-index:2;animation:up linear forwards}
@keyframes up{0%{opacity:0;transform:translateY(0)}10%{opacity:.9}100%{opacity:0;transform:translateY(-115vh) rotate(35deg)}}
@keyframes p{50%{transform:scale(1.16)}}
#player{position:fixed;width:1px;height:1px;left:-10px;top:-10px;opacity:0;pointer-events:none}
.musicNote{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:12px;opacity:.55;z-index:4}
</style>
</head>
<body>

<!-- Reproductor oficial de YouTube: se inicia al tocar el sobre -->
<div id="player"></div>

<div id="intro" onclick="openLetter()">
  <div class="intro">
    <div class="env">💌</div>
    <div id="introText" style="font-size:24px;line-height:1.65;min-height:300px;max-height:72vh;overflow:hidden"></div>
    <div class="hint">TOCA LA PANTALLA</div>
  </div>
</div>

<div id="scene">
  <div class="card">
    <div class="mini">PARA TI, VALERIA</div>
    <div class="heart">❤️</div>
    <h1>Te amo, Valeria</h1>
    <div class="line"></div>
    <div class="msg" id="msg">
      No necesitaba una fecha especial para decírtelo.<br><br>
      Solo quería recordarte que eres alguien muy especial para mí,
      y que cada momento contigo tiene un lugar en mi corazón.
    </div>
    <div class="sig">Con todo mi amor ❤️</div>
    <button onclick="last(event)">Una última cosa...</button>
  </div>
</div>

<div class="musicNote">🎵 Mi Persona Favorita — Río Roma</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let ytPlayer=null;
let youtubeReady=false;
let pendingPlay=false;
const MUSIC_START=20; // segundos: entra directamente después de la introducción

// Video oficial de Río Roma: Mi Persona Favorita
function onYouTubeIframeAPIReady(){
  ytPlayer=new YT.Player('player',{
    videoId:'AJKzOgv5YNU',
    playerVars:{
      autoplay:0,
      controls:0,
      loop:1,
      playlist:'AJKzOgv5YNU',
      playsinline:1,
      rel:0
    },
    events:{
      onReady:function(){
        youtubeReady=true;
        ytPlayer.seekTo(MUSIC_START,true);
        if(pendingPlay) playMusic();
      }
    }
  });
}

function playMusic(){
  if(ytPlayer && youtubeReady){
    ytPlayer.unMute();
    ytPlayer.setVolume(65);
    ytPlayer.seekTo(MUSIC_START,true);
    ytPlayer.playVideo();
  }
}

function openLetter(){
  pendingPlay=true;
  playMusic();

  const intro=document.getElementById('intro');
  const text=document.getElementById('introText');
  const hint=document.querySelector('.hint');
  const lines=[
    'Aún recuerdo nuestro primer beso...',
    'Yo tan nervioso,',
    'y tú tan hermosa. ❤️',
    'Parece increíble que un momento pudiera quedarse tan grabado en mi corazón.',
    'Desde aquel día, algo cambió en mí.',
    'Y con el tiempo descubrí que no solo me gustabas...',
    'me estaba enamorando de ti.',
    'Me encanta tu sonrisa,',
    'esa sonrisa hermosa que puede cambiar por completo mi día. ❤️',
    'Me encanta tu sencillez,',
    'tu forma tan natural de ser, sin pretender ser alguien más.',
    'Me encanta que seas simplemente tú,',
    'porque esa mujer auténtica, sencilla y hermosa es de quien me enamoré.',
    'Y aún sigo enamorado de ti,',
    'más que la primera vez que te conocí.',
    'Cada día encuentro una razón nueva para quererte un poquito más.',
    'Gracias por llegar a mi vida.',
    'Gracias por cada sonrisa, cada abrazo, cada momento y cada recuerdo.',
    'Si pudiera volver al día de nuestro primer beso,',
    'lo volvería a elegir una y mil veces.',
    'Porque entre tantas personas,',
    'la vida me llevó hasta ti... ❤️',
    'Y hoy solo quiero que nunca olvides algo:',
    'TE AMO, VALERIA.',
    'Y te elegiría otra vez. ❤️'
  ];

  hint.textContent='';
  text.innerHTML='';

  let lineIndex=0;
  let charIndex=0;

  function typeNext(){
    if(lineIndex>=lines.length){
      setTimeout(()=>{
        intro.classList.add('hide');
        setInterval(heart,450);
      },3200);
      return;
    }

    if(charIndex===0){
      const line=document.createElement('span');
      line.className='typeLine';
      line.id='currentLine';
      text.appendChild(line);
    }

    const line=document.getElementById('currentLine');
    line.innerHTML=lines[lineIndex].slice(0,charIndex+1)+'<span class="caret"></span>';
    charIndex++;

    if(charIndex<lines[lineIndex].length){
      setTimeout(typeNext,42);
    }else{
      line.innerHTML=lines[lineIndex];
      lineIndex++;
      charIndex=0;
      setTimeout(typeNext,850);
    }
  }

  typeNext();
}
function heart(){
  let h=document.createElement('div');
  h.className='float';
  h.textContent=['❤️','💕','💗','💖','✨'][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=15+Math.random()*28+'px';
  h.style.animationDuration=5+Math.random()*7+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),13000);
}

function last(e){
  e.stopPropagation();
  document.getElementById('msg').innerHTML=
  'Si alguna vez dudas de lo que siento por ti:<br><br>'+
  '<strong style="font-size:32px">TE AMO, VALERIA ❤️</strong>';
}
</script>
</body>
</html>
